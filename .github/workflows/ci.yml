name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/setup.sh
          bash -n docs/watch-usage.sh
          bash -n docs/watch-clarity.sh
          bash -n docs/watch-workers.sh
